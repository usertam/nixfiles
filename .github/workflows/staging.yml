name: "Create staging updates"
on:
  workflow_dispatch:
    inputs:
      discard-staging-changes:
        description: 'Discard all staging branch changes (skip cherry-pick)'
        required: true
        type: boolean
        default: false
  schedule:
  - cron: '0 22 * * SUN'
permissions:
  contents: write
  pull-requests: write
jobs:
  staging:
    name: Stage updates on staging branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@v2
      id: staging-bot-token
      with:
        app-id: ${{ secrets.STAGING_BOT_APP_ID }}
        private-key: ${{ secrets.STAGING_BOT_PRIVATE_KEY }}
    - uses: actions/checkout@main
      with:
        token: ${{ steps.staging-bot-token.outputs.token }}
        fetch-depth: 0
    - name: Set up staging bot identity
      run: |
        BOT_LOGIN="${{ steps.staging-bot-token.outputs.app-slug }}[bot]"
        git config user.name "$BOT_LOGIN"
        git config user.email "$(gh api "/users/$BOT_LOGIN" --jq '.id')+$BOT_LOGIN@users.noreply.github.com"
      env:
        GH_TOKEN: ${{ steps.staging-bot-token.outputs.token }}
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: false
    - name: Cherry-pick non-bot staging commits onto working master
      if: inputs.discard-staging-changes != true
      run: |
        mapfile -t COMMITS < <(git rev-list origin/staging ^master \
          --perl-regexp --author='^(?!.*usertam-staging-bot).*' \
          --reverse)

        if (( ${#COMMITS[@]} )); then
          echo 'Changes not staged for working master:'
          git log --no-walk --pretty=format:'    %h %s (%an)' "${COMMITS[@]}" && echo
          git cherry-pick --empty=drop "${COMMITS[@]}"
        else
          echo 'No changes to cherry-pick.'
        fi
    - name: Update flake lock file
      run: |
        git switch -c staging
        nix flake update --commit-lock-file
    - name: Update kernel definitions
      run: |
        set -o pipefail
        # Regenerate from releases.json, prefetching hashes as it carries none.
        # Mainline takes the rc or release; stable picks up a release from its first point release.
        # Versions end up in nix arguments and JSON, so refuse anything but kernel.org formats.
        curl -fsSL https://www.kernel.org/releases.json | jq -r '
          def version: .version | if test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?(-rc[0-9]+)?$") then . else error("bad version: \(.)") end;
          (.releases[] | select(.moniker == "mainline") | version
            | "mainline \(.) https://git.kernel.org/torvalds/t/linux-\(.).tar.gz --unpack"),
          ([.releases[] | select(.moniker == "stable") | version] | max_by(split(".") | map(tonumber))
            | "stable \(.) https://cdn.kernel.org/pub/linux/kernel/v\(split(".")[0]).x/linux-\(.).tar.xz")
        ' | while read -r key version url unpack; do
          hash=$(nix store prefetch-file --json $unpack "$url" | jq -r .hash)
          printf '{"%s": {"version": "%s", "hash": "%s"}}\n' "$key" "$version" "$hash"
        done | jq -s --indent 4 add > hosts/common/kernels.json
        # Commit if changed, listing version bumps against the committed file.
        git diff --quiet hosts/common/kernels.json || \
          git commit hosts/common/kernels.json -m "$(jq -rn \
            --argjson old "$(git show HEAD:hosts/common/kernels.json)" \
            --argjson new "$(< hosts/common/kernels.json)" '
              [$new | keys_unsorted[] | select($old[.].version != $new[.].version)
                | "linux_\(.): \($old[.].version) -> \($new[.].version)"] | join(", ")
            ')"
    - name: Check for updates
      run: |
        if ! git diff origin/master staging --exit-code; then
          echo "FLAKE_UPDATE=true" >> $GITHUB_ENV
        fi
    - name: Create pull request
      if: env.FLAKE_UPDATE == 'true'
      run: |
        git push -f origin staging:staging
        body='Automatic bump by running `nix flake update --commit-lock-file`.'
        # Append the kernels.json diff, minus its file headers, if the kernels moved.
        if ! git diff --quiet origin/master staging -- hosts/common/kernels.json; then
          printf -v body '%s Also bumped `kernels.json` with\n```diff\n%s\n```' "$body" \
            "$(git diff origin/master staging -- hosts/common/kernels.json | sed '1,/^+++ /d')"
        fi
        # Create the PR, or refresh the body of the open one to match the force-push.
        if [ -z "$(gh pr list --head staging)" ]; then
          gh pr create --base master --head staging \
            --title 'Apply staging updates' \
            --body "$body"
        else
          gh pr edit staging --body "$body"
        fi
      env:
        GH_TOKEN: ${{ steps.staging-bot-token.outputs.token }}
